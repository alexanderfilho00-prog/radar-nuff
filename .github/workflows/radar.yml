name: Radar diário

on:
  schedule:
    # Dias úteis às 8h34 de Brasília (11h34 UTC). O cron do GitHub é em UTC
    # e pode atrasar alguns minutos em horários de pico.
    - cron: "34 11 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "Data do relatório (AAAA-MM-DD). Vazio = hoje em Brasília."
        required: false

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Rodar o radar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RADAR_DATE: ${{ inputs.date }}
        run: npm run radar

      - name: Salvar o relatório no repositório
        run: |
          git config user.name "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reports
          if git diff --cached --quiet; then
            echo "Nada novo para salvar."
            exit 0
          fi
          git commit -m "Radar: relatório de $(ls -t data/reports | head -1 | sed 's/.json//')"
          git push
